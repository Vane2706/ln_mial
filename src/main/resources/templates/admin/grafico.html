<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{admin/he_fo_ad::head}"></head>

<style>

    body{
        background:#f4f6f9;
        font-family:'Segoe UI', sans-serif;
    }

    /* TITULO */
    .page-title{
        font-weight:700;
        color:#222;
        text-align:center;
        margin-bottom:30px;
    }

    /* CONTENEDOR GENERAL */
    .charts-wrapper{
        padding:10px;
    }

    /* CARD DEL GRAFICO */
    .chart-card{
        background:#fff;
        border-radius:18px;
        box-shadow:0 12px 30px rgba(0,0,0,0.08);
        padding:20px;
        margin-bottom:25px;
        transition:0.3s;
    }

    .chart-card:hover{
        transform:translateY(-3px);
        box-shadow:0 18px 40px rgba(0,0,0,0.12);
    }

    /* TITULO CARD */
    .chart-title{
        font-size:18px;
        font-weight:600;
        color:#333;
        text-align:center;
        margin-bottom:15px;
    }

    /* CANVAS RESPONSIVE */
    canvas{
        max-width:100% !important;
        height:auto !important;
    }

    /* HEADER DASHBOARD */
    .dashboard-header{
        background:#fff;
        padding:20px;
        border-radius:18px;
        box-shadow:0 10px 25px rgba(0,0,0,0.06);
        margin-bottom:25px;
        text-align:center;
    }

    .dashboard-header h2{
        margin:0;
        font-weight:700;
    }

    .dashboard-header p{
        margin:0;
        color:#777;
        font-size:14px;
    }

</style>

<body class="d-flex flex-column min-vh-100">

<div th:insert="~{admin/he_fo_ad::header}"></div>

<main class="flex-grow-1">

    <div class="container my-5 charts-wrapper">

        <!-- HEADER -->
        <div class="dashboard-header">

            <h2>📊 Dashboard de Compras</h2>
            <p>Estadísticas de ventas por año y mes</p>

        </div>

        <!-- GRAFICOS -->
        <div id="chartsContainer"></div>

    </div>

</main>

<div th:insert="~{admin/he_fo_ad::footer}"></div>

</body>

<script>
    fetch('/admin/statistics/yearly-monthly-orders')
        .then(response => response.json())
        .then(data => {

            const chartsContainer = document.getElementById('chartsContainer');

            Object.entries(data).forEach(([year, monthsData]) => {

                const chartCard = document.createElement('div');
                chartCard.className = 'chart-card';

                const title = document.createElement('div');
                title.className = 'chart-title';
                title.textContent = `📈 Compras del Año ${year}`;

                const canvas = document.createElement('canvas');
                canvas.id = `chart-${year}`;

                chartCard.appendChild(title);
                chartCard.appendChild(canvas);
                chartsContainer.appendChild(chartCard);

                const labels = Array.from({length: 12}, (_, i) =>
                    new Date(0, i).toLocaleString('es', {month: 'long'})
                );

                const dataValues = labels.map((_, index) => monthsData[index + 1] || 0);

                const ctx = canvas.getContext('2d');

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `Compras ${year}`,
                            data: dataValues,
                            backgroundColor: 'rgba(13, 202, 240, 0.5)',
                            borderColor: 'rgba(13, 202, 240, 1)',
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#333'
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        return `${context.raw} compras`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: {
                                    color: '#555'
                                }
                            },
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: '#555',
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });

            });

        })
        .catch(error => console.error('Error:', error));
</script>

</html>
